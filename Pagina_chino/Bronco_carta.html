<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para Bronco</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;

    background:
        radial-gradient(circle at center, #765337, #382518 65%,#170f0a);

    font-family: Georgia, serif;
    color: #f1dfc2;
}

/* Textura vintage */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        repeating-linear-gradient(
            90deg,
            transparent 0px,
            transparent 8px,
            rgba(255,255,255,.018) 9px
        );
    pointer-events: none;
}

/* Contenedor perfectamente centrado */
.container {
    position: relative;
    z-index: 2;
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
}

/* Encabezado */
.subtitle {
    font-size: 12px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #d0ae7f;
    margin-bottom: 18px;
}

h1 {
    font-size: clamp(35px, 8vw, 55px);
    font-weight: normal;
    letter-spacing: 3px;
    margin-bottom: 45px;
    text-shadow: 0 4px 15px #0008;
}

/* Disco de vinilo: botón */
.record-button {
    width: 270px;
    height: 270px;
    border-radius: 50%;
    border: 9px solid #9b7145;
background: #090909;
    cursor: pointer;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;

    box-shadow:
        0 0 0 4px #3b2515,
        0 15px 45px #000a;

    animation: rotate 8s linear infinite;
    transition: box-shadow .3s;
}

/* Surcos del vinilo */
.record-button::before {
    content: "";
    position: absolute;
    inset: 10px;
    border-radius: 50%;

   

    border: 1px solid #444;
}

/* Etiqueta central */
.label {
    position: relative;
    z-index: 2;
    width: 95px;
    height: 95px;
    border-radius: 50%;

    background: radial-gradient(circle, #c39a62, #754522);
    border: 5px solid #e0bd89;

    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;

    box-shadow: 0 0 15px #0009;
}

.label span:first-child {
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 2px;
    color: #321e10;
}

.label span:last-child {
    font-size: 8px;
    letter-spacing: 2px;
    color: #321e10;
    margin-top: 4px;
}

/* Giro del disco */
@keyframes rotate {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

/* Efecto interactivo */
.record-button {
    width: 270px;
    height: 270px;
    border-radius: 50%;
    border: 7px solid #9b7145;
    background-image: url("disco.jpeg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    cursor: pointer;
    display: block;
    animation: rotate 8s linear infinite;
    transition: box-shadow .3s;
}

/* Instrucción */
.instruction {
    margin-top: 40px;
    font-size: 13px;
    letter-spacing: 3px;
    color: #d8bd99;
    text-transform: uppercase;
}

.line {
    width: 90px;
    height: 1px;
    background: #b58b5d;
    margin: 22px auto;
}

.footer {
    font-size: 11px;
    color: #b99a75;
    letter-spacing: 2px;
}

/* Adaptación a celulares */
@media (max-width: 400px) {
    .record-button {
        width: 235px;
        height: 235px;
    }

    h1 {
        margin-bottom: 35px;
    }
}
</style>
</head>

<body>

<main class="container">

    <div class="subtitle">
        Una dedicatoria especial
    </div>

    <h1>Para Bronco</h1>

    <!-- DISCO DE VINILO QUE FUNCIONA COMO BOTÓN -->
   <button
    class="record-button"
    onclick="window.location.href='carta.html'"
    aria-label="Abrir carta para Bronco"
>
</button>
        <div class="label">
            <span>BRONCO</span>
            <span>EDICIÓN ESPECIAL</span>
        </div>

    </button>


    <div class="line"></div>


</main>

</body>
</html>
